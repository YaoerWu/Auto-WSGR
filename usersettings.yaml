# AutoWSGR 用户配置
# 字段名全大写；未出现的字段使用模块内置默认值，只写想改的那几个。
# 查找顺序：显式路径 → 当前工作目录的 usersettings.yaml → 内置默认值。

LOG:
  LOG_LEVEL: DEBUG            # DEBUG / INFO / WARNING / ERROR
  LOG_SYSTEM_DIR: logs        # 日志保存根目录
  LOG_ROTATION: 10 MB         # 单个日志文件达到该大小后切分
  LOG_RETENTION: 7 days       # 日志文件保留周期
  LOG_COMBAT_OPEN: false      # 是否放行 combat 及子通道的 DEBUG 日志

DEVICE:
  ADB_CONNECTION: null            # ADB 连接地址；null = 自动发现设备
  DEVICE_EMULATOR_TYPE: MuMu      # 雷电 / 蓝叠 / MuMu / 云手机 / 其他
  DEVICE_EMULATOR_PATH: null      # 模拟器可执行文件路径；null = 自动检测
  DEVICE_OPERATION_DELAY_MIN: 0.0 # 每次操作前的随机延迟下界（秒）
  DEVICE_OPERATION_DELAY_MAX: 0.0 # 每次操作前的随机延迟上界（秒）

FLEET_SELECT:
  # 系统标准船名: 游戏内显示船名
  # 编队规则里写的是图鉴标准名，搜索时换成游戏内实际显示的名字。
  SHIP_NAME_MAP:
    AIII: 希尔德布兰德
    85工程: 契卡洛夫
    U-47: U-47·狼群
    巴尔的摩: 巴尔的摩·英魂
